<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto — Lic. Mateo Benítez</title>
    <link rel="stylesheet" href="./estilos.css">
</head>

<body>
    <header class="encabezado">
        <a href="./index.html">
            <img src="./recursos/imagenes/seguridad.jpg" alt="logo seguridad">
        </a>
        <nav class="navegacion">
            <a href="./index.html" class="enlace-nav">Inicio</a>
            <a href="./contacto.html" class="enlace-nav">Contacto</a>
        </nav>
    </header>

    <main class="contenido-principal">
        <h1>Contacto</h1>

        <form action="#" method="post" class="formulario-contacto">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono">

            <label for="descripcion">Comentario sobre el caso:</label>
            <textarea id="descripcion" name="descripcion" rows="4" required></textarea>

            <div class="contenedor-botones">
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpiar">
            </div>
        </form>
    </main>

    <footer class="pie-pagina">
        <ul>
            <li><a href="#">@MateoBenitezCiberseguridad</a></li>
            <li>Av. Colón 500 - B° Centro</li>
        </ul>
    </footer>
</body>

</html>
